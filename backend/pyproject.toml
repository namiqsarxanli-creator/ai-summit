[project]
name = "facemark-backend"
version = "0.1.0"
description = "FACEMARK backend — FastAPI modular monolith"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.13,<2.0",
  "python-dotenv>=1.0,<2.0",
  "argon2-cffi>=23.1,<24.0",
  "email-validator>=2.2,<3.0",
  # Resend's REST API (app/modules/auth/otp_delivery.py) — a plain
  # synchronous call from a sync route handler, not a new async stack.
  "httpx>=0.27,<1.0",
  # Authenticated encryption (AES-256-GCM) of OTP codes in the delivery outbox.
  "cryptography>=43,<51",
  # Profile photos (app/core/images.py): the upload is decoded, cropped, resized
  # and RE-ENCODED, never stored or served as received.
  "pillow>=11.0,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.7,<1.0",
  "mypy>=1.13,<2.0",
  "hypothesis>=6.100,<7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
# conftest.py pins DEMO_MODE/RESEND_API_KEY in os.environ before importing
# the app (Settings is cached at import).
"tests/conftest.py" = ["E402"]
