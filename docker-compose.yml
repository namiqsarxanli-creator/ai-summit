# FACEMARK local/demo infrastructure — M01 foundation.
#
# Three services only, matching IMPLEMENTATION_PLAN.md M01 exactly:
# db (PostgreSQL), backend (FastAPI), frontend (Next.js). No Redis, no
# broker, no extra containers — ARCHITECTURE.md explicitly excludes
# them (§4: "modular monolith"; §17.10/§22: "No Redis").

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - facemark_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEMO_MODE: ${DEMO_MODE:-false}
      # Assembled here from the same POSTGRES_* values the `db` service
      # uses — a single source of truth for credentials, never
      # duplicated as a second literal in .env.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Consumed only by `python -m app.cli seed` (M03) — no fallback,
      # by design (ARCHITECTURE.md §19.8): the CLI fails loudly if unset
      # rather than seeding a known password.
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_STAFF_PASSWORD: ${SEED_STAFF_PASSWORD:-}
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    volumes:
      # Bind-mount for dev hot-reload. Dependencies live at /opt/venv
      # (outside /app) in the image, so this mount cannot shadow them —
      # see backend/Dockerfile.
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    # Single worker is an ARCHITECTURE.md invariant (#17), not a
    # default — overriding the image's own CMD here keeps --reload
    # available for local development while still pinning --workers 1.
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --reload

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      # Anonymous volumes so the bind mount above does not shadow the
      # dependencies / build output installed inside the image.
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  facemark_postgres_data:
